<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>八咫鏡・弐式</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B12">
<style>
:root{--bg:#0e1123;--card:#151a30;--card2:#11152a;--line:#2b3050;--gold:#d8b054;--goldD:#8a7434;
--tx:#e9e7dc;--dim:#8b90a8;--buy:#ff6b7d;--sell:#57c7f5;--ok:#7fdc9a;--warn:#ffc46b;
--serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:14px;max-width:520px;margin:0 auto}
h1{font-family:var(--serif);font-size:26px;letter-spacing:14px;text-indent:8px;text-align:center;margin:8px 0 2px;font-weight:600;color:var(--tx)}
h1 .shiki{font-size:12px;letter-spacing:4px;text-indent:0;color:var(--gold);border:1px solid var(--goldD);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.subttl{font-family:var(--serif);font-size:11.5px;letter-spacing:2px;color:var(--dim);text-align:center;margin-bottom:14px}
.tabs{display:flex;gap:10px;margin-bottom:12px}
.tab{flex:1;padding:11px 0;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--dim);font-family:var(--serif);font-size:15px;letter-spacing:3px;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--gold);background:#1a1f3a;font-weight:700;box-shadow:0 0 0 1px rgba(216,176,84,.15) inset}
textarea{width:100%;background:var(--card2);border:1px dashed var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:13px;min-height:58px;font-family:ui-monospace,monospace}
textarea:focus{outline:none;border-color:var(--goldD)}
.now{display:none;margin-top:10px}
.now label{font-family:var(--serif);font-size:12px;letter-spacing:2px;color:var(--dim)}
.now input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:10px;font-size:18px;margin-top:4px}
#fuda{display:none;margin-top:14px;background:var(--card);border:1px solid var(--gold);border-radius:16px;overflow:hidden;box-shadow:0 0 24px rgba(216,176,84,.06)}
#verdict{display:none;padding:11px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.sympill{font-family:var(--serif);font-size:12px;color:var(--gold);border:1px solid var(--goldD);border-radius:6px;padding:2px 8px;margin-right:8px}
.sym{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:2px}
.waza{font-family:var(--serif);font-size:12px;color:var(--dim);letter-spacing:1px}
.side{margin:12px 14px 6px;border-radius:14px;text-align:center;padding:15px 0;font-family:var(--serif);font-size:36px;font-weight:800;letter-spacing:18px;text-indent:18px}
.side.buy{background:rgba(255,107,125,.12);color:var(--buy);border:1px solid rgba(255,107,125,.5)}
.side.sell{background:rgba(87,199,245,.10);color:var(--sell);border:1px solid rgba(87,199,245,.5)}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px}
.row .k{font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--dim)}
.row .v{font-size:31px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.row .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px}
.copy{font-size:12px;color:var(--gold);border:1px solid var(--goldD);border-radius:9px;padding:6px 12px;margin-left:10px;background:none;cursor:pointer;font-family:var(--serif);letter-spacing:1px}
.copy:active{background:#26264a}
.band{margin:4px 14px;padding:9px 10px;border-radius:10px;background:rgba(255,196,107,.08);border:1px solid rgba(255,196,107,.45);color:var(--warn);font-size:14px;font-weight:700;text-align:center;font-family:var(--serif);letter-spacing:1px}
.risk{padding:9px 14px 4px;font-size:12px;color:var(--dim);border-top:1px solid var(--line)}
.after{padding:6px 14px 12px;font-size:12px;color:var(--dim);font-family:var(--serif);letter-spacing:1px}
.after b{color:var(--gold)}
#slFuda{display:none;margin-top:14px;background:var(--card);border:1px solid rgba(127,220,154,.5);border-radius:16px;padding:13px 14px}
#slFuda .t{font-size:13px;color:var(--dim);font-family:var(--serif)}
#slFuda .p{font-size:34px;font-weight:900;margin:4px 0;color:var(--gold)}
#slFuda .n{font-size:12px;color:var(--dim)}
.bt{display:flex;gap:8px;align-items:center;padding:0 14px 12px}
.bt input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px;font-size:15px}
.bt .r{font-size:13px;color:var(--dim);min-width:96px;text-align:right}
details{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
summary{padding:11px 14px;font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--dim);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.cell label{font-size:11px;color:var(--dim)}
.cell input{width:100%;background:#0d1020;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px;font-size:15px;margin-top:2px}
.cell.wide{grid-column:1/3}
#shield{display:none;margin:8px 12px 12px;padding:8px;border-radius:8px;background:rgba(216,176,84,.07);border:1px solid var(--goldD);color:var(--gold);font-size:12px}
footer{font-family:var(--serif);text-align:center;color:#4a4f68;font-size:10px;margin:18px 0 6px;letter-spacing:4px}
.ph{margin-top:14px;text-align:center;color:#4a4f68;font-size:13px;padding:26px 0;border:1px dashed var(--line);border-radius:14px;font-family:var(--serif);letter-spacing:2px}
h1 .mark{color:var(--gold);font-size:20px;letter-spacing:0;text-indent:0;margin-right:2px}
.tab.sym.on{border-color:var(--gold);color:var(--tx)}
.tab.sub.on{border-color:#5a7fd6;color:var(--tx);box-shadow:0 0 0 1px rgba(90,127,214,.15) inset}
.fetchrow{display:flex;gap:10px;align-items:center;margin-top:10px}
.tsbtn{flex:0 0 auto;font-family:var(--serif);font-size:13px;letter-spacing:1px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.tsbtn:active{border-color:var(--gold)}
#tsChip{font-size:12.5px;color:var(--ok)}
.ans{font-family:var(--serif);font-size:15px;letter-spacing:8px;color:var(--dim);margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
</style></head>

<script>
const $=id=>document.getElementById(id);
let mode='fx', sub='main', cur={};   // cur: {sig,sl,side,waza,tag}
const KEYS=['cap','risk','peak','conv','wurl','wkey'];
function save(){KEYS.forEach(k=>localStorage.setItem('jo2_'+k,$(k).value))}
function load(){KEYS.forEach(k=>{const v=localStorage.getItem('jo2_'+k);if(v)$(k).value=v})}
load(); KEYS.forEach(k=>$(k).addEventListener('input',()=>{save();render()}));

function setMode(m){mode=m;$('tabFx').classList.toggle('on',m==='fx');$('tabAu').classList.toggle('on',m==='au');render()}
function setSub(s){sub=s;$('tabMain').classList.toggle('on',s==='main');$('tabLate').classList.toggle('on',s==='late');
 $('nowBox').style.display=s==='late'?'block':'none';render()}
$('nowP').addEventListener('input',render);
$('notice').addEventListener('input',()=>{parseNotice($('notice').value);render()});
$('fill').addEventListener('input',btDiff);

function parseNotice(t){
 cur={};$('slFuda').style.display='none';
 if(!t)return;
 setMode(/XAU|GOLD|金/i.test(t)?'au':'fx');
 if(/SL移動|新SL/.test(t)){showSLMove(t);return}
 const mSig=t.match(/@\s*([0-9]+\.?[0-9]*)/), mSL=t.match(/SL\s*([0-9]+\.?[0-9]*)/i);
 const mW=t.match(/【(.+?)】/), mTag=t.match(/\[(v2X|SLREV|v2|DIM)\]/i);
 if(!(mSig&&mSL))return;
 cur.sig=parseFloat(mSig[1]);cur.sl=parseFloat(mSL[1]);
 cur.side=/buy|買/i.test(t)?1:(/sell|売/i.test(t)?-1:(cur.sl<cur.sig?1:-1));
 cur.waza=mW?mW[1]:'';cur.tag=mTag?mTag[1]:'';
}

function showSLMove(t){
 const mNew=t.match(/新SL\s*([0-9.]+)/),mPrev=t.match(/前\s*([0-9.]+)/),mBE=t.match(/建値差([+\-][0-9.]+p)/);
 const win=/建値差\+/.test(t);
 $('slNew').textContent=mNew?mNew[1]:'—';
 $('slNew').style.color=win?'#7fdc9a':'var(--tx)';
 $('slNote').innerHTML=(win?'🔒 建値超え(もう負けない) ':'')+(mPrev?'前 '+mPrev[1]+' / ':'')+(mBE?'建値差 '+mBE[1]:'');
 $('slFuda').style.display='block';$('fuda').style.display='none';$('ph').style.display='none';
}

function shieldRisk(){
 const cap=+$('cap').value||0,peak=Math.max(+$('peak').value||0,cap);
 let r=+$('risk').value||1;const dd=peak>0?(peak-cap)/peak:0;
 if(dd>=0.08){r=r/2;$('shield').style.display='block';
  $('shield').innerHTML='🛡 盾発動中: 過去最高から'+(dd*100).toFixed(1)+'%下 → リスクを半減して計算('+r.toFixed(2)+'%)';}
 else $('shield').style.display='none';
 return r;
}

function render(){
 if(cur.sl===undefined){$('fuda').style.display='none';$('ph').style.display=$('slFuda').style.display==='block'?'none':'block';return}
 $('ph').style.display='none';$('fuda').style.display='block';
 const cap=+$('cap').value||0, conv=+$('conv').value||158, r=shieldRisk(), riskJPY=cap*r/100;
 const dir=cur.side, sig=cur.sig, sl=cur.sl;
 let entryBase=sig, ok=true, vHTML='';
 const v=$('verdict');
 if(sub==='late'){
  const now=parseFloat($('nowP').value);
  if(now){
   const D=(now-sig)*dir/Math.abs(sig-sl);
   const dead=dir===1?now<=sl:now>=sl;
   v.style.display='block';
   if(dead){v.style.color='#ff8fa3';v.style.background='rgba(255,23,68,.10)';
    vHTML='☠ シグナル死亡(SL割れ) ── 入らない。次を待つ';ok=false}
   else if(D<=0.5){v.style.color='var(--ok)';v.style.background='rgba(0,230,118,.08)';
    vHTML='✅ 乗ってよし ── '+(D<=0?'有利圏':'SL幅の'+(D*100).toFixed(0)+'%地点')+'(SLは据え置き)';entryBase=now}
   else{v.style.color='var(--qty)';v.style.background='rgba(255,213,79,.08)';
    vHTML='⏸ 見送り ── SL幅の'+(D*100).toFixed(0)+'%進行済み。ルール⑤: 次の再ブレイクで';ok=false}
   v.textContent='';v.innerHTML=vHTML;
  } else {v.style.display='block';v.style.background='none';v.style.color='var(--dim)';v.innerHTML='現在値を入れると軍配が上がります';ok=false}
 } else v.style.display='none';

 $('sym').textContent=mode==='fx'?'USDJPY':'金スポット(CFD)';$('symp').textContent=mode==='fx'?'円':'金';
 $('waza').textContent=(cur.waza?('【'+cur.waza+'】'):'')+(cur.tag?(' '+cur.tag):'');
 const s=$('side');s.textContent=dir===1?'買':'売';s.className='side '+(dir===1?'buy':'sell');
 $('slP2').textContent=sl;
 window.slRaw=String(sl);

 const w=Math.abs(entryBase-sl);
 if(!ok||w<=0){$('qty').innerHTML='—<small></small>';$('riskLine').textContent='';window.qtyRaw='';return}
 if(mode==='fx'){
  const q=Math.floor((riskJPY/w)/1000)*1000;
  if(q<=0){
   $('qty').innerHTML='0<small> ── 発注不可</small>';window.qtyRaw='';
   $('riskLine').textContent='⚠ 最小0.1万でもリスク約'+Math.round(1000*w).toLocaleString()+'円(資金の'+(1000*w/cap*100).toFixed(2)+'%)。規定リスク超過 ── 見送りが掟';
   return;
  }
  const man=q/10000;
  $('qty').innerHTML=man.toFixed(1)+'<small>万('+q.toLocaleString()+'通貨)</small>';
  window.qtyRaw=man.toFixed(1);
  $('riskLine').textContent='SL幅'+(w/0.01).toFixed(0)+'銭 / 想定リスク約'+Math.round(q*w).toLocaleString()+'円(資金の'+(q*w/cap*100).toFixed(2)+'%)';
 }else{
  const oz=Math.floor(riskJPY/(w*conv)*10)/10;
  if(oz<=0){
   $('qty').innerHTML='0<small> ── 発注不可</small>';window.qtyRaw='';
   $('riskLine').textContent='⚠ 最小0.1ozでもリスク約'+Math.round(0.1*w*conv).toLocaleString()+'円(資金の'+(0.1*w*conv/cap*100).toFixed(2)+'%)。規定リスク超過 ── 見送りが掟';
   return;
  }
  $('qty').innerHTML=oz.toFixed(1)+'<small>oz</small>';
  window.qtyRaw=oz.toFixed(1);
  $('riskLine').textContent='SL幅$'+w.toFixed(2)+' / 想定リスク約'+Math.round(oz*w*conv).toLocaleString()+'円(資金の'+(oz*w*conv/cap*100).toFixed(2)+'%)';
 }
}

function btDiff(){
 const f=parseFloat($('fill').value);
 if(!f||cur.sig===undefined){$('btOut').textContent='';return}
 const base=(sub==='late'&&parseFloat($('nowP').value))?parseFloat($('nowP').value):cur.sig;
 const d=(f-base)*(cur.side===1?1:-1);
 const p=mode==='fx'?(d/0.01).toFixed(1)+'p':'$'+d.toFixed(2);
 $('btOut').textContent='BT差 '+(d<=0?'':'+')+p+(d<=0?'(有利)':'(不利)');
}

function cp(name){const v=window[name];if(!v)return;navigator.clipboard&&navigator.clipboard.writeText(v)}


// ── 勾玉から最新シグナルを取得(旧・序の自動取得の復活) ──
async function fetchLatest(manual){
 const wu=($('wurl').value||'').replace(/\/$/,''), wk=$('wkey').value||'';
 if(!wu){if(manual)$('tsChip').textContent='⚙で勾玉URLと合言葉を設定してください';return}
 try{
  const q='?key='+encodeURIComponent(wk);
  const r=await fetch(wu+'/latest'+q,{cache:'no-store'});
  const j=await r.json();
  if(j&&j.body){
   $('notice').value=j.body; parseNotice(j.body); render();
   $('tsChip').textContent='✅ '+(j.ts||'');
  } else if(manual){$('tsChip').textContent='勾玉に未着(シグナルなし)'}
  // SL移動の追撃札
  try{
   const r2=await fetch(wu+'/latest_sl'+q,{cache:'no-store'});
   const j2=await r2.json();
   if(j2&&j2.body&&/新SL/.test(j2.body)){showSLMove(j2.body);$('fuda').style.display=cur.sl!==undefined?'block':'none';$('ph').style.display='none';
    $('tsChip').textContent+=' / 📍SL移動 '+(j2.ts||'')}
  }catch(e){}
 }catch(e){if(manual)$('tsChip').textContent='取得失敗 ── URLと合言葉を確認'}
}
// ── 現在値の参考取得(GMOコイン公開為替API・USDJPYのみ) ──
let rateTimer=null;
async function fetchRate(manual){
 if(mode!=='fx'){$('rateInfo').textContent='金は参考API未対応 ── 手動入力で';return}
 let src=null,u=null;
 // 1) 勾玉中継(CORS対応・推奨)
 const wu=($('wurl').value||'').replace(/\/$/,''), wk=$('wkey').value||'';
 if(wu){
  try{
   const r=await fetch(wu+'/rate?key='+encodeURIComponent(wk),{cache:'no-store'});
   const j=await r.json();
   if(j&&j.ask){u=j;src='勾玉中継'}
  }catch(e){}
 }
 // 2) 直接(CORS次第)
 if(!u){
  try{
   const r=await fetch('https://forex-api.coin.z.com/public/v1/ticker',{cache:'no-store'});
   const j=await r.json();
   const d=(j.data||[]).find(x=>x.symbol==='USD_JPY');
   if(d){u=d;src='直接'}
  }catch(e){}
 }
 if(!u){
  if(manual)$('rateInfo').textContent=wu?'取得失敗 ── 勾玉のWorkerがv7.1(中継口つき)か確認を':'取得失敗 ── ⚙設定に勾玉URLと合言葉を入れると中継で取れます';
  return;
 }
 const px=cur.side===1?parseFloat(u.ask):cur.side===-1?parseFloat(u.bid):(parseFloat(u.ask)+parseFloat(u.bid))/2;
 $('nowP').value=px.toFixed(3);
 const t=new Date();
 $('rateInfo').textContent='参考値('+src+' '+(cur.side===1?'ask':cur.side===-1?'bid':'mid')+') '
  +t.toTimeString().slice(0,8)+' ── 発注前にGMO画面の実レートで最終確認';
 render();
 if(!rateTimer)rateTimer=setInterval(()=>{if(sub==='late'&&mode==='fx')fetchRate(false);else{clearInterval(rateTimer);rateTimer=null}},5000);
}
if($('wurl').value)fetchLatest(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>

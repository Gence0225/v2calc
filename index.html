<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>八咫鏡・弐式</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B12">
<style>
:root{--ink:#0B0B12;--panel:#14141F;--txt:#E8E6F0;--dim:#8A889C;--faint:#5E5C70;
--g1:#E8C877;--g2:#B8862E;--take:#5FCF9A;--sora:#6FAEDC;--shu:#E0796B;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
font-size:14px;background:var(--ink);min-height:100vh;padding:16px 13px 60px;max-width:720px}
.mincho{font-family:"Shippori Mincho","Yu Mincho",serif}
.mono{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace}
.goldtext{background:linear-gradient(135deg,var(--g1) 25%,var(--g2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
header{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.hicon{width:24px;height:24px;border-radius:6px;border:1px solid rgba(232,200,119,.5);color:var(--g1);
display:flex;align-items:center;justify-content:center;font-size:13px}
h1{font-size:21px;margin:0;letter-spacing:.05em}
h1 .shiki{font-size:11px;letter-spacing:.2em;color:var(--g1);border:1px solid rgba(232,200,119,.4);border-radius:5px;padding:1px 7px;margin-left:7px;vertical-align:2px;-webkit-text-fill-color:var(--g1)}
.subttl{color:var(--faint);font-size:10.5px;margin:0 0 12px 33px}
.symtabs{display:flex;gap:7px;margin:0 0 8px}
.symtab{flex:1;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:10px;
padding:9px 4px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer}
.symtab.on{background:#1E1A2C;border-color:rgba(232,200,119,.5);color:var(--g1)}
textarea{width:100%;background:var(--panel);border:1px dashed var(--line);border-radius:12px;color:var(--txt);
padding:11px;font-size:12.5px;min-height:54px;font-family:ui-monospace,monospace;margin-top:8px}
textarea:focus{outline:none;border-color:rgba(232,200,119,.4)}
.fetchrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tsbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;
padding:9px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.tsbtn:active{border-color:rgba(232,200,119,.5);color:var(--g1)}
#tsChip{font-size:11.5px;color:var(--take)}
.now{display:none;margin-top:8px}
.now label{font-size:10.5px;color:var(--faint)}
.now input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:17px;margin-top:3px}
.sec{display:flex;align-items:center;gap:10px;margin:18px 0 9px}
.sec h2{font-size:11.5px;margin:0;letter-spacing:.3em;font-weight:600;color:var(--g1)}
.sec .rule{flex:1;height:1px;background:var(--line)}
.ph{text-align:center;color:var(--faint);font-size:12.5px;letter-spacing:.14em;padding:22px 0;
background:var(--panel);border:1px solid var(--line);border-radius:13px}
#fuda{display:none;background:var(--panel);border:1px solid rgba(232,200,119,.35);border-radius:13px;overflow:hidden}
#verdict{display:none;padding:10px 15px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:8px;padding:12px 15px 0;flex-wrap:wrap}
.sympill{font-size:10.5px;border-radius:5px;padding:1px 7px;font-weight:700;color:var(--g1);border:1px solid rgba(232,200,119,.4)}
.sym{font-size:16px;font-weight:700;letter-spacing:.06em}
.waza{margin-left:auto;font-size:12px;color:var(--dim)}
.side{margin:11px 15px 4px;border-radius:11px;text-align:center;padding:12px 0;font-size:31px;font-weight:800;letter-spacing:.5em;text-indent:.5em}
.side.buy{color:var(--take);border:1px solid rgba(95,207,154,.4);background:rgba(95,207,154,.06)}
.side.sell{color:var(--sora);border:1px solid rgba(111,174,220,.4);background:rgba(111,174,220,.06)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 15px}
.row .k{font-size:10.5px;color:var(--faint);letter-spacing:.14em}
.row .v{font-size:29px;font-weight:700;letter-spacing:-.01em}
.row .v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:4px;-webkit-text-fill-color:var(--dim)}
.copy{font-size:11.5px;color:var(--g1);border:1px solid rgba(232,200,119,.4);border-radius:8px;padding:6px 12px;margin-left:10px;background:none;cursor:pointer;font-weight:600}
.copy:active{background:#1E1A2C}
.band{margin:3px 15px;padding:8px 10px;border-radius:9px;background:rgba(224,121,107,.08);
border:1px solid rgba(224,121,107,.4);color:var(--shu);font-size:13px;font-weight:700;text-align:center}
.risk{padding:9px 15px 3px;font-size:11px;color:var(--dim);border-top:1px solid var(--line)}
.bt{display:flex;gap:8px;align-items:center;padding:2px 15px 10px}
.bt input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-size:14px}
.bt .r{font-size:12px;color:var(--dim);min-width:92px;text-align:right}
.after{padding:4px 15px 13px;font-size:11px;color:var(--faint)}
.after b{color:var(--g1)}
#slFuda{display:none;background:var(--panel);border:1px solid rgba(95,207,154,.4);border-radius:13px;padding:12px 15px;margin-top:9px}
#slFuda .t{font-size:11.5px;color:var(--dim)}
#slFuda .p{font-size:31px;font-weight:800;margin:3px 0}
#slFuda .n{font-size:11px;color:var(--faint)}
details{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px}
summary{padding:11px 15px;font-size:12px;letter-spacing:.1em;color:var(--dim);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 13px 13px}
.cell label{font-size:10px;color:var(--faint)}
.cell input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:8px;font-size:14px;margin-top:2px}
.cell.wide{grid-column:1/3}
#shield{display:none;margin:0 13px 13px;padding:8px;border-radius:8px;background:rgba(232,200,119,.06);border:1px solid rgba(232,200,119,.35);color:var(--g1);font-size:11.5px}
footer{text-align:center;color:var(--faint);font-size:9.5px;margin-top:22px;letter-spacing:.3em}
</style></head><body>

<header><div class="hicon mincho">鏡</div><h1 class="mincho goldtext">八咫鏡<span class="shiki">弐式</span></h1></header>
<div class="subttl">真のリスクを映す ── 資金 × risk% ÷ SL幅</div>

<div class="symtabs">
 <div class="symtab on" id="tabFx" onclick="setMode('fx')">円 USDJPY</div>
 <div class="symtab" id="tabAu" onclick="setMode('au')">金 XAUUSD</div>
</div>
<div class="symtabs">
 <div class="symtab on" id="tabMain" onclick="setSub('main')">定時乗車</div>
 <div class="symtab" id="tabLate" onclick="setSub('late')">後乗り判定</div>
</div>

<textarea id="notice" placeholder="通知をここに貼る(勾玉接続済みなら下の取得で自動)&#10;例: [v2X] USDJPY sell @ 157.365 / SL158.457/109p 【兜割り】"></textarea>
<div class="fetchrow">
 <button class="tsbtn" id="tsBtn" onclick="fetchLatest(true)">🔄 勾玉から最新を取得</button>
 <span id="tsChip"></span>
</div>

<div class="now" id="nowBox"><label>現在値(後乗り)</label>
<div style="display:flex;gap:8px;align-items:center">
<input id="nowP" type="tel" inputmode="decimal" placeholder="158.44" style="flex:1">
<button class="copy" id="rateBtn" onclick="fetchRate(true)" style="white-space:nowrap;padding:10px 12px">📡 取得</button>
</div>
<div id="rateInfo" style="font-size:10.5px;color:var(--faint);margin-top:4px"></div>
</div>

<div class="sec"><h2>答</h2><div class="rule"></div></div>
<div class="ph" id="ph">通知が入ると、ここに発注札が立ちます</div>

<div id="fuda">
 <div id="verdict"></div>
 <div class="head"><span class="sympill" id="symp">円</span><span class="sym" id="sym">USDJPY</span><span class="waza" id="waza"></span></div>
 <div class="side" id="side">売</div>
 <div class="row"><span class="k">数量</span>
   <span><span class="v goldtext" id="qty">0.2<small id="qtyU">万</small></span><button class="copy" onclick="cp('qtyRaw')">コピー</button></span></div>
 <div class="band">✅ 決済同時発注(逆指値)を必ずON</div>
 <div class="row"><span class="k">逆指値レート</span>
   <span><span class="v mono" id="slP2">—</span><button class="copy" onclick="cp('slRaw')">コピー</button></span></div>
 <div class="risk" id="riskLine"></div>
 <div class="bt"><input id="fill" type="tel" inputmode="decimal" placeholder="約定したら実約定価格を入力 → BT差">
   <span class="r" id="btOut"></span></div>
 <div class="after">発注後: 台帳で直感 <b>◯ △ ✕</b> を押す</div>
</div>

<div id="slFuda">
 <div class="t">🛠 SL変更 ── GMOの決済逆指値をこの価格へ(決済同時発注✅のまま)</div>
 <div class="p mono" id="slNew">—</div>
 <div class="n" id="slNote"></div>
</div>

<details><summary>⚙ 接続と資金の設定(初回のみ・端末に保存)</summary>
 <div class="grid">
  <div class="cell wide"><label>勾玉URL(例 https://xxx.workers.dev)</label><input id="wurl" type="url" value=""></div>
  <div class="cell wide"><label>合言葉(key)</label><input id="wkey" type="text" value=""></div>
  <div class="cell"><label>資金(円)</label><input id="cap" type="tel" inputmode="numeric" value="210000"></div>
  <div class="cell"><label>リスク(%)</label><input id="risk" type="tel" inputmode="decimal" value="1.0"></div>
  <div class="cell"><label>過去最高資金(盾)</label><input id="peak" type="tel" inputmode="numeric" value="210000"></div>
  <div class="cell"><label>金換算 1$=円</label><input id="conv" type="tel" inputmode="decimal" value="158"></div>
 </div>
 <div id="shield"></div>
</details>

<footer class="mincho">陰 陽 寮 ── USDJPY=1000通貨切捨て / 金=0.1oz切捨て</footer>

<script>
const $=id=>document.getElementById(id);
let mode='fx', sub='main', cur={};
const KEYS=['cap','risk','peak','conv','wurl','wkey'];
function save(){KEYS.forEach(k=>localStorage.setItem('jo2_'+k,$(k).value))}
function load(){KEYS.forEach(k=>{const v=localStorage.getItem('jo2_'+k);if(v)$(k).value=v})}
load(); KEYS.forEach(k=>$(k).addEventListener('input',()=>{save();render()}));

function setMode(m){mode=m;$('tabFx').classList.toggle('on',m==='fx');$('tabAu').classList.toggle('on',m==='au');render()}
function setSub(s){sub=s;$('tabMain').classList.toggle('on',s==='main');$('tabLate').classList.toggle('on',s==='late');
 $('nowBox').style.display=s==='late'?'block':'none';render()}
$('nowP').addEventListener('input',render);
$('notice').addEventListener('input',()=>{parseNotice($('notice').value);render()});
$('fill').addEventListener('input',btDiff);

function parseNotice(t){
 cur={};$('slFuda').style.display='none';
 if(!t)return;
 setMode(/XAU|GOLD|金/i.test(t)?'au':'fx');
 if(/SL移動|新SL/.test(t)){showSLMove(t);return}
 const mSig=t.match(/@\s*([0-9]+\.?[0-9]*)/), mSL=t.match(/SL\s*([0-9]+\.?[0-9]*)/i);
 const mW=t.match(/【(.+?)】/), mTag=t.match(/\[(v2X|SLREV|v2|DIM)\]/i);
 if(!(mSig&&mSL))return;
 cur.sig=parseFloat(mSig[1]);cur.sl=parseFloat(mSL[1]);
 cur.side=/buy|買/i.test(t)?1:(/sell|売/i.test(t)?-1:(cur.sl<cur.sig?1:-1));
 cur.waza=mW?mW[1]:'';cur.tag=mTag?mTag[1]:'';
}

function showSLMove(t){
 const mNew=t.match(/新SL\s*([0-9.]+)/),mPrev=t.match(/前\s*([0-9.]+)/),mBE=t.match(/建値差([+\-][0-9.]+p)/);
 const win=/建値差\+/.test(t);
 $('slNew').textContent=mNew?mNew[1]:'—';
 $('slNew').style.color=win?'var(--take)':'var(--txt)';
 $('slNote').innerHTML=(win?'🔒 建値超え(もう負けない) ':'')+(mPrev?'前 '+mPrev[1]+' / ':'')+(mBE?'建値差 '+mBE[1]:'');
 $('slFuda').style.display='block';
}

function shieldRisk(){
 const cap=+$('cap').value||0,peak=Math.max(+$('peak').value||0,cap);
 let r=+$('risk').value||1;const dd=peak>0?(peak-cap)/peak:0;
 if(dd>=0.08){r=r/2;$('shield').style.display='block';
  $('shield').innerHTML='🛡 盾発動中: 過去最高から'+(dd*100).toFixed(1)+'%下 → リスクを半減して計算('+r.toFixed(2)+'%)';}
 else $('shield').style.display='none';
 return r;
}

function render(){
 if(cur.sl===undefined){$('fuda').style.display='none';$('ph').style.display=$('slFuda').style.display==='block'?'none':'block';return}
 $('ph').style.display='none';$('fuda').style.display='block';
 const cap=+$('cap').value||0, conv=+$('conv').value||158, r=shieldRisk(), riskJPY=cap*r/100;
 const dir=cur.side, sig=cur.sig, sl=cur.sl;
 let entryBase=sig, ok=true, vHTML='';
 const v=$('verdict');
 if(sub==='late'){
  const now=parseFloat($('nowP').value);
  if(now){
   const D=(now-sig)*dir/Math.abs(sig-sl);
   const dead=dir===1?now<=sl:now>=sl;
   v.style.display='block';
   if(dead){v.style.color='var(--shu)';v.style.background='rgba(224,121,107,.07)';
    vHTML='☠ シグナル死亡(SL割れ) ── 入らない。次を待つ';ok=false}
   else if(D<=0.5){v.style.color='var(--take)';v.style.background='rgba(95,207,154,.06)';
    vHTML='✅ 乗ってよし ── '+(D<=0?'有利圏':'SL幅の'+(D*100).toFixed(0)+'%地点')+'(SLは据え置き)';entryBase=now}
   else{v.style.color='var(--g1)';v.style.background='rgba(232,200,119,.05)';
    vHTML='⏸ 見送り ── SL幅の'+(D*100).toFixed(0)+'%進行済み。ルール⑤: 次の再ブレイクで';ok=false}
   v.textContent='';v.innerHTML=vHTML;
  } else {v.style.display='block';v.style.background='none';v.style.color='var(--faint)';v.innerHTML='現在値を入れると軍配が上がります';ok=false}
 } else v.style.display='none';

 $('sym').textContent=mode==='fx'?'USDJPY':'金スポット(CFD)';$('symp').textContent=mode==='fx'?'円':'金';
 $('waza').textContent=(cur.waza?('【'+cur.waza+'】'):'')+(cur.tag?(' '+cur.tag):'');
 const s=$('side');s.textContent=dir===1?'買':'売';s.className='side '+(dir===1?'buy':'sell');
 $('slP2').textContent=sl;
 window.slRaw=String(sl);

 const w=Math.abs(entryBase-sl);
 if(!ok||w<=0){$('qty').innerHTML='—<small></small>';$('riskLine').textContent='';window.qtyRaw='';return}
 if(mode==='fx'){
  const q=Math.floor((riskJPY/w)/1000)*1000;
  if(q<=0){
   $('qty').innerHTML='0<small> ── 発注不可</small>';window.qtyRaw='';
   $('riskLine').textContent='⚠ 最小0.1万でもリスク約'+Math.round(1000*w).toLocaleString()+'円(資金の'+(1000*w/cap*100).toFixed(2)+'%)。規定リスク超過 ── 見送りが掟';
   return;
  }
  const man=q/10000;
  $('qty').innerHTML=man.toFixed(1)+'<small>万('+q.toLocaleString()+'通貨)</small>';
  window.qtyRaw=man.toFixed(1);
  $('riskLine').textContent='SL幅'+(w/0.01).toFixed(0)+'銭 / 想定リスク約'+Math.round(q*w).toLocaleString()+'円(資金の'+(q*w/cap*100).toFixed(2)+'%)';
 }else{
  const oz=Math.floor(riskJPY/(w*conv)*10)/10;
  if(oz<=0){
   $('qty').innerHTML='0<small> ── 発注不可</small>';window.qtyRaw='';
   $('riskLine').textContent='⚠ 最小0.1ozでもリスク約'+Math.round(0.1*w*conv).toLocaleString()+'円(資金の'+(0.1*w*conv/cap*100).toFixed(2)+'%)。規定リスク超過 ── 見送りが掟';
   return;
  }
  $('qty').innerHTML=oz.toFixed(1)+'<small>oz</small>';
  window.qtyRaw=oz.toFixed(1);
  $('riskLine').textContent='SL幅$'+w.toFixed(2)+' / 想定リスク約'+Math.round(oz*w*conv).toLocaleString()+'円(資金の'+(oz*w*conv/cap*100).toFixed(2)+'%)';
 }
}

function btDiff(){
 const f=parseFloat($('fill').value);
 if(!f||cur.sig===undefined){$('btOut').textContent='';return}
 const base=(sub==='late'&&parseFloat($('nowP').value))?parseFloat($('nowP').value):cur.sig;
 const d=(f-base)*(cur.side===1?1:-1);
 const p=mode==='fx'?(d/0.01).toFixed(1)+'p':'$'+d.toFixed(2);
 $('btOut').textContent='BT差 '+(d<=0?'':'+')+p+(d<=0?'(有利)':'(不利)');
}

function cp(name){const v=window[name];if(!v)return;navigator.clipboard&&navigator.clipboard.writeText(v)}

// ── 勾玉から最新シグナルを取得 ──
async function fetchLatest(manual){
 const wu=($('wurl').value||'').replace(/\/$/,''), wk=$('wkey').value||'';
 if(!wu){if(manual)$('tsChip').textContent='⚙で勾玉URLと合言葉を設定してください';return}
 try{
  const q='?key='+encodeURIComponent(wk);
  const r=await fetch(wu+'/latest'+q,{cache:'no-store'});
  const j=await r.json();
  if(j&&j.body){
   $('notice').value=j.body; parseNotice(j.body); render();
   $('tsChip').textContent='✅ '+(j.ts||'');
  } else if(manual){$('tsChip').textContent='勾玉に未着(シグナルなし)'}
  try{
   const r2=await fetch(wu+'/latest_sl'+q,{cache:'no-store'});
   const j2=await r2.json();
   if(j2&&j2.body&&/新SL/.test(j2.body)){showSLMove(j2.body);
    $('tsChip').textContent+=' / 📍SL移動 '+(j2.ts||'')}
  }catch(e){}
 }catch(e){if(manual)$('tsChip').textContent='取得失敗 ── URLと合言葉を確認'}
}

// ── 現在値の参考取得(勾玉中継→直接→手動の三段構え) ──
let rateTimer=null;
async function fetchRate(manual){
 if(mode!=='fx'){$('rateInfo').textContent='金は参考API未対応 ── 手動入力で';return}
 let src=null,u=null;
 const wu=($('wurl').value||'').replace(/\/$/,''), wk=$('wkey').value||'';
 if(wu){
  try{
   const r=await fetch(wu+'/rate?key='+encodeURIComponent(wk),{cache:'no-store'});
   const j=await r.json();
   if(j&&j.ask){u=j;src='勾玉中継'}
  }catch(e){}
 }
 if(!u){
  try{
   const r=await fetch('https://forex-api.coin.z.com/public/v1/ticker',{cache:'no-store'});
   const j=await r.json();
   const d=(j.data||[]).find(x=>x.symbol==='USD_JPY');
   if(d){u=d;src='直接'}
  }catch(e){}
 }
 if(!u){
  if(manual)$('rateInfo').textContent=wu?'取得失敗 ── 勾玉のWorkerがv7.1(中継口つき)か確認を':'取得失敗 ── ⚙設定に勾玉URLと合言葉を入れると中継で取れます';
  return;
 }
 const px=cur.side===1?parseFloat(u.ask):cur.side===-1?parseFloat(u.bid):(parseFloat(u.ask)+parseFloat(u.bid))/2;
 $('nowP').value=px.toFixed(3);
 const t=new Date();
 $('rateInfo').textContent='参考値('+src+' '+(cur.side===1?'ask':cur.side===-1?'bid':'mid')+') '
  +t.toTimeString().slice(0,8)+' ── 発注前にGMO画面の実レートで最終確認';
 render();
 if(!rateTimer)rateTimer=setInterval(()=>{if(sub==='late'&&mode==='fx')fetchRate(false);else{clearInterval(rateTimer);rateTimer=null}},5000);
}

if($('wurl').value)fetchLatest(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
